# config.import traz os secrets e parameters da aws (LocalStack) para este arquivo env.
# O seed é feito pelo etc/aws/init.sh (parameters.csv / secrets.csv).

spring:
  config:
    import:
      - aws-secretsmanager:/secret/algashop/billing-scheduler/database?prefix=scheduler.secrets.datasource.
      - aws-secretsmanager:/secret/algashop/billing-scheduler/fastpay?prefix=scheduler.secrets.fastpay.
      - aws-parameterstore:/config/algashop/billing-scheduler?prefix=scheduler.params
  cloud:
    aws:
      region:
        static: us-east-1
      endpoint: http://algashop-localstack:4566
      credentials:
        access-key: LSIAQAAAAAAVNCBMPNSG
        secret-key: test
  datasource:
    url: ${scheduler.params.datasource.url}
    username: ${scheduler.secrets.datasource.username}
    password: ${scheduler.secrets.datasource.password}

algashop:
  integrations:
    payment:
      fastpay:
        hostname: ${scheduler.params.fastpay.hostname}
        private-token: ${scheduler.secrets.fastpay.private-token}
